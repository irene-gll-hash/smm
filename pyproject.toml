[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qifa-smm-service"
version = "0.2.0"
description = "Closed-network SMM content pipeline for КИФА"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "beautifulsoup4>=4.12,<5",
  "google-api-python-client>=2.150,<3",
  "google-auth[requests]>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
]

[project.scripts]
qifa-smm = "qifa_smm.main:run"
qifa-google-auth = "qifa_smm.google_auth:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
